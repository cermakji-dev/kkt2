name: Check
on: [push, pull_request]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: isys
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: isys
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U isys" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://isys:test_password@localhost:5432/isys?schema=public
      DIRECT_URL: postgresql://isys:test_password@localhost:5432/isys?schema=public
      NEXT_PUBLIC_SUPABASE_URL: https://irexkjtrylkokmogwbfc.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_7Co8_9BbDv3zK3qNpvIrUg_KCiZaFXa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # TODO: po commitnutí package-lock.json vrátit `npm ci` a `cache: npm`
      - run: npm install
      - name: Prisma db push
        run: npx prisma db push 2>&1 | tee /tmp/push.log; test ${PIPESTATUS[0]} -eq 0 || { echo "::error title=prisma db push::$(tail -c 1800 /tmp/push.log | tr '\n' ' ')"; exit 1; }
        shell: bash
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.log || {
            sed -e 's/\x1b\[[0-9;]*m//g' /tmp/build.log | grep -v '^\s*$' | grep -iE -B2 -A12 'error|failed|type ' | tail -c 3500 | sed -e 's/%/%25/g' | tr '\n' ' ' > /tmp/err.txt
            echo "::error title=build::$(cat /tmp/err.txt)"
            exit 1
          }
        shell: bash
      - name: Testovací data
        run: npx tsx e2e/seed.ts
      - name: Prohlížeč pro testy
        run: npx playwright install --with-deps chromium
      - name: Testy v prohlížeči
        id: e2e
        run: npx playwright test
        continue-on-error: true
      - name: Screenshoty do větve e2e-shots
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          [ -d e2e-shots ] || exit 0
          cd e2e-shots
          git init -q && git checkout -q -b e2e-shots
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Screenshoty ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" e2e-shots
      - name: Výsledek testů
        if: steps.e2e.outcome == 'failure'
        run: exit 1
