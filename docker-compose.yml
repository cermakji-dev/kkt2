services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: isys
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: isys
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - isys_pgdata:/var/lib/postgresql/data
volumes:
  isys_pgdata:
